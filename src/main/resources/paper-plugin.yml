name: RuruRules
version: 1.0.0
main: jp.vcmc.rururules.RuruRulesPlugin
api-version: '26.2'
folia-supported: true
description: 'Server rules enforcement plugin for Paper/Folia'

commands:
  rules:
    description: 'Server rules command'
    usage: /rules [agree|reload|reset]
    aliases: [rule]

permissions:
  rururules.admin:
    description: 'Admin permission for RuruRules'
    default: op
